[workspace]
members  = ["apps/aiq-runner", "apps/aiq-verifier"]
resolver = "3"

[workspace.package]
authors     = ["acgxv <xv@acg.box>"]
description = "Transparent, reproducible benchmarks for practical AI and agent work"
edition     = "2024"
homepage    = "https://aiq.wiki"
license     = "GPL-3.0-only"
repository  = "https://github.com/acg-box/aiq"
version     = "0.1.0"

[workspace.dependencies]
# crates.io
clap                     = { version = "4.6", features = ["derive"] }
ed25519-dalek            = { version = "2.2" }
hex                      = { version = "0.4" }
jiff                     = { version = "0.2.35", default-features = false, features = ["tzdb-bundle-always"] }
jiff-tzdb                = { version = "0.1.8" }
serde                    = { version = "1.0", features = ["derive"] }
serde_json               = { version = "1.0" }
serde_json_canonicalizer = { version = "0.3.2" }
sha2                     = { version = "0.11" }
ureq                     = { version = "3.3", default-features = false, features = ["rustls"] }
