name: aiq-candidate-runtime
services:
  runner_proxy:
    image: aiq-candidate-runner-proxy:local
    build:
      context: ../..
      dockerfile: deploy/candidate-runtime/Dockerfile.proxy
      args: {SOURCE_COMMIT: "${AIQ_SOURCE_COMMIT}"}
      platforms: [linux/arm64]
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10002,gid=10002]
    networks: {runner_internal: {ipv4_address: 10.248.34.2}, runner_proxy_egress: {}}
    restart: "no"
  runner:
    image: aiq-candidate-runner:local
    build:
      context: ../..
      dockerfile: deploy/candidate-runtime/Dockerfile.runner
      args: {SOURCE_COMMIT: "${AIQ_SOURCE_COMMIT}"}
      platforms: [linux/arm64]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, seccomp=../official-runtime/seccomp-bwrap.json]
    environment: {CODEX_HOME: /codex-home, HTTPS_PROXY: "http://10.248.34.2:3128", HTTP_PROXY: "http://10.248.34.2:3128", NO_PROXY: "localhost,127.0.0.1", AIQ_TRUST_POLICY_DIGEST: "${AIQ_TRUST_POLICY_DIGEST}"}
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10001,gid=10001, /run:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001]
    volumes:
      - {type: bind, source: "${AIQ_CORE_TASKS}", target: /inputs/core-tasks, read_only: true}
      - {type: bind, source: "${AIQ_CONTRAST_TASKS}", target: /inputs/contrast-tasks, read_only: true}
      - {type: bind, source: "${AIQ_CANDIDATE_SOURCE}", target: /inputs/candidate-source, read_only: true}
      - {type: bind, source: "${AIQ_CORE_WORKSPACES}", target: /inputs/core-workspaces, read_only: true}
      - {type: bind, source: "${AIQ_CONTRAST_WORKSPACES}", target: /inputs/contrast-workspaces, read_only: true}
      - {type: bind, source: "${AIQ_EVALUATORS}", target: /inputs/evaluators, read_only: true}
      - {type: bind, source: "${AIQ_EVALUATOR_RUNTIME}", target: /inputs/evaluator-runtime, read_only: true}
      - {type: bind, source: "${AIQ_TOOLCHAIN}", target: /inputs/toolchain, read_only: true}
      - {type: bind, source: "${AIQ_CAPABILITIES}", target: /inputs/capabilities.json, read_only: true}
      - {type: bind, source: "${AIQ_SCHEDULE}", target: /inputs/schedule.json, read_only: true}
      - {type: bind, source: "${AIQ_SIGNED_ADMISSION}", target: /inputs/signed-admission.json, read_only: true}
      - {type: bind, source: "${AIQ_CORPUS_MANIFEST}", target: /inputs/corpus-manifest.json, read_only: true}
      - {type: bind, source: "${AIQ_CORE_COMMITMENT}", target: /inputs/core-commitment.json, read_only: true}
      - {type: bind, source: "${AIQ_CONTRAST_COMMITMENT}", target: /inputs/contrast-commitment.json, read_only: true}
      - {type: bind, source: "${AIQ_TRUST_POLICY}", target: /inputs/release-trust-policy.json, read_only: true}
      - {type: bind, source: "${AIQ_PLAN_INPUTS}", target: /inputs/plan-inputs.json, read_only: true}
      - {type: bind, source: "${AIQ_CODEX_BINARY}", target: /inputs/bin/codex, read_only: true}
      - {type: bind, source: "${AIQ_RUNNER_BINARY}", target: /inputs/bin/aiq-runner, read_only: true}
      - {type: bind, source: "${AIQ_CODEX_HOME}", target: /codex-home}
      - {type: bind, source: "${AIQ_CODEX_AUTH}", target: /codex-home/auth.json, read_only: true}
      - {type: bind, source: "${AIQ_AUTHORIZATION_KEY}", target: /run/secrets/authorization-key, read_only: true}
      - {type: bind, source: "${AIQ_RUNNER_KEY}", target: /run/secrets/runner-key, read_only: true}
      - {type: bind, source: "${AIQ_TRUST_POLICY_PIN}", target: /run/secrets/trust-policy-pin, read_only: true}
      - {type: bind, source: "${AIQ_EXECUTION}", target: /candidate/execution}
      - {type: bind, source: "${AIQ_WORK}", target: /candidate/work}
      - {type: bind, source: "${AIQ_ARTIFACTS}", target: /candidate/artifacts}
      - {type: bind, source: "${AIQ_OUTPUTS}", target: /candidate/outputs}
      - {type: bind, source: "${AIQ_CONTROL}", target: /control}
      - {type: bind, source: "${AIQ_VERIFIER_REPLAY}", target: /candidate/verifier-replay, read_only: true}
    depends_on: [runner_proxy]
    networks: {runner_internal: {ipv4_address: 10.248.34.3}}
    restart: "no"
  verifier_proxy:
    image: aiq-candidate-verifier-proxy:local
    build:
      context: ../..
      dockerfile: deploy/candidate-runtime/Dockerfile.verifier-proxy
      args: {SOURCE_COMMIT: "${AIQ_SOURCE_COMMIT}"}
      platforms: [linux/arm64]
    user: "10004:10004"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10004,gid=10004]
    networks: {verifier_internal: {ipv4_address: 10.248.36.2}, verifier_proxy_egress: {}}
    restart: "no"
  verifier:
    image: aiq-candidate-verifier:local
    build:
      context: ../..
      dockerfile: deploy/candidate-runtime/Dockerfile.verifier
      args: {SOURCE_COMMIT: "${AIQ_SOURCE_COMMIT}"}
      platforms: [linux/arm64]
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {HTTPS_PROXY: "http://10.248.36.2:3128", HTTP_PROXY: "http://10.248.36.2:3128", NO_PROXY: "localhost,127.0.0.1", AIQ_TRUST_POLICY_DIGEST: "${AIQ_TRUST_POLICY_DIGEST}"}
    tmpfs: [/tmp:rw,noexec,nosuid,nodev,size=256m,mode=0700,uid=10003,gid=10003]
    volumes:
      - {type: bind, source: "${AIQ_CORE_TASKS}", target: /inputs/core-tasks, read_only: true}
      - {type: bind, source: "${AIQ_CONTRAST_TASKS}", target: /inputs/contrast-tasks, read_only: true}
      - {type: bind, source: "${AIQ_CANDIDATE_SOURCE}", target: /inputs/candidate-source, read_only: true}
      - {type: bind, source: "${AIQ_EVALUATORS}", target: /inputs/evaluators, read_only: true}
      - {type: bind, source: "${AIQ_EVALUATOR_RUNTIME}", target: /inputs/evaluator-runtime, read_only: true}
      - {type: bind, source: "${AIQ_SIGNED_ADMISSION}", target: /inputs/signed-admission.json, read_only: true}
      - {type: bind, source: "${AIQ_CORPUS_MANIFEST}", target: /inputs/corpus-manifest.json, read_only: true}
      - {type: bind, source: "${AIQ_CORE_COMMITMENT}", target: /inputs/core-commitment.json, read_only: true}
      - {type: bind, source: "${AIQ_CONTRAST_COMMITMENT}", target: /inputs/contrast-commitment.json, read_only: true}
      - {type: bind, source: "${AIQ_TRUST_POLICY}", target: /inputs/release-trust-policy.json, read_only: true}
      - {type: bind, source: "${AIQ_VERIFIER_BINARY}", target: /inputs/bin/aiq-verifier, read_only: true}
      - {type: bind, source: "${AIQ_VERIFIER_KEY}", target: /run/secrets/verifier-key, read_only: true}
      - {type: bind, source: "${AIQ_VERIFIER_TRUST_POLICY_PIN}", target: /run/secrets/trust-policy-pin, read_only: true}
      - {type: bind, source: "${AIQ_ARTIFACTS}", target: /candidate/artifacts, read_only: true}
      - {type: bind, source: "${AIQ_OUTPUTS}", target: /candidate/outputs}
      - {type: bind, source: "${AIQ_CONTROL}", target: /control, read_only: true}
      - {type: bind, source: "${AIQ_VERIFIER_REPLAY}", target: /candidate/verifier-replay}
    depends_on: [verifier_proxy]
    networks: {verifier_internal: {ipv4_address: 10.248.36.3}}
    restart: "no"
networks:
  runner_internal: {name: aiq-candidate-runner-internal, internal: true, ipam: {config: [{subnet: 10.248.34.0/24}]}}
  runner_proxy_egress: {name: aiq-candidate-runner-proxy-egress}
  verifier_internal: {name: aiq-candidate-verifier-internal, internal: true, ipam: {config: [{subnet: 10.248.36.0/24}]}}
  verifier_proxy_egress: {name: aiq-candidate-verifier-proxy-egress}
