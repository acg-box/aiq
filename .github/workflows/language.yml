name: Language Checks

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: language-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-make

      - name: Install nextest
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: nextest

      - name: Run Rust format check
        run: cargo make fmt-rust-check

      - name: Run Rust check
        run: cargo make check-rust

      - name: Run Rust style check
        uses: acg-box/vibe-style@3a0959eac5363c4c427382bae1d80d87ecadb702 # v0.2.3
        with:
          language: rust
          workspace: true
          args: --all-features
          version: v0.2.3

      - name: Run Rust clippy
        run: cargo make lint-rust

      - name: Run Rust tests
        run: cargo make test-rust

      - name: Build Rust workspace
        run: cargo make build-rust

  rust-linux-arm64-runner:
    name: Linux arm64 runner build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Build Linux arm64 production runner
        run: cargo build --locked --package aiq-runner

  toml-check:
    name: TOML check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
          rustflags: ''

      - name: Install cargo-make
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-make

      - name: Install taplo
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: taplo

      - name: Run TOML format check
        run: cargo make fmt-toml-check

  typescript-check:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.17.0

      - name: Verify npm version
        run: npm --version | grep --fixed-strings --line-regexp 11.17.0

      - name: Install cargo-make
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-make

      - name: Install locked TypeScript tooling
        run: npm ci --ignore-scripts

      - name: Run TypeScript format check
        run: cargo make fmt-typescript-check

      - name: Run TypeScript check
        run: cargo make check-typescript

      - name: Run TypeScript lint
        run: cargo make lint-typescript

      - name: Run TypeScript tests
        run: cargo make test-typescript

      - name: Build web application
        run: cargo make build-web

      - name: Install Playwright browsers
        run: >-
          npm exec --workspace @aiq/wiki-web --
          playwright install --with-deps chromium firefox webkit

      - name: Run browser acceptance tests
        run: npm run test:browser --workspace @aiq/wiki-web

  database-check:
    name: Database check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_PASSWORD: aiq-contract-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Fetch latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install cargo-make
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-make

      - name: Check database schema
        run: cargo make check-database

      - name: Create fresh initializer test database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          createdb --username postgres aiq_initializer

      - name: Exercise the production initializer
        env:
          AIQ_DATABASE_INIT_TEST_PSQL: psql
          AIQ_DATABASE_INIT_TEST_URL: postgresql://postgres:aiq-contract-local-only@127.0.0.1:5432/aiq_initializer
        run: node --test databases/init.test.ts

      - name: Remove initializer test database and roles
        if: always()
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            dropdb --if-exists --username postgres aiq_initializer
          docker exec "${{ job.services.postgres.id }}" \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command \
            "drop role if exists aiq_publisher;
            drop role if exists aiq_verifier;
            drop role if exists service_role;
            drop role if exists authenticator;
            drop role if exists authenticated;
            drop role if exists anon;"

      - name: Create fresh preview initializer test database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          createdb --username postgres aiq_preview_initializer

      - name: Exercise the preview initializer and browser roles
        env:
          AIQ_DATABASE_PREVIEW_TEST_PSQL: psql
          AIQ_DATABASE_PREVIEW_TEST_URL: postgresql://postgres:aiq-contract-local-only@127.0.0.1:5432/aiq_preview_initializer
        run: node --test databases/preview-init.test.ts

      - name: Remove preview initializer test database and roles
        if: always()
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            dropdb --if-exists --username postgres aiq_preview_initializer
          docker exec "${{ job.services.postgres.id }}" \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command \
            "drop role if exists aiq_publisher;
            drop role if exists aiq_verifier;
            drop role if exists service_role;
            drop role if exists authenticator;
            drop role if exists authenticated;
            drop role if exists anon;"

      - name: Create database roles
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=1
          --command
          "create role anon nologin;
          create role authenticated nologin;
          create role authenticator nologin noinherit;
          create role service_role nologin;"

      - name: Apply database schema
        run: >-
          docker exec --interactive "${{ job.services.postgres.id }}"
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=1
          < databases/schema.sql

      - name: Load synthetic integration fixtures
        run: >-
          docker exec --interactive "${{ job.services.postgres.id }}"
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=1
          --file -
          < databases/synthetic-demo.sql

      - name: Smoke database
        run: >-
          docker exec --interactive "${{ job.services.postgres.id }}"
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=1
          --file -
          < databases/smoke.sql

      - name: Exercise critical database state transitions
        run: >-
          docker exec --interactive "${{ job.services.postgres.id }}"
          psql --username postgres --dbname postgres --set ON_ERROR_STOP=1
          --file -
          < databases/integration.sql
