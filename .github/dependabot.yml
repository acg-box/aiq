version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    labels: []

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    labels: []
    groups:
      web-runtime:
        patterns:
          - "@supabase/*"
          - "next"
          - "react"
          - "react-dom"
      typescript-toolchain:
        patterns:
          - "@types/*"
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
    labels: []
