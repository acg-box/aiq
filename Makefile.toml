# Monorepo workspace tasks.

[config]
skip_core_tasks = true

# Check
# | task                   | type      | cwd |
# | ---------------------- | --------- | --- |
# | check                   | composite |     |
# | check-candidate-runtime | command   |     |
# | check-database          | command   |     |
# | check-official-runtime  | command   |     |
# | check-rust              | command   |     |
# | check-typescript        | command   |     |
# | storage-lifecycle       | command   |     |

[tasks.check]
clear = true
workspace = false
dependencies = [
	"check-candidate-runtime",
	"check-database",
	"check-official-runtime",
	"check-rust",
	"check-typescript",
]

[tasks.check-candidate-runtime]
workspace = false
command = "python3"
args = ["-B", "deploy/candidate-runtime/test_runtime.py"]

[tasks.check-database]
workspace = false
command = "node"
args = ["scripts/check-database-schema.ts"]

[tasks.check-official-runtime]
workspace = false
command = "python3"
args = ["deploy/official-runtime/test_static.py"]

[tasks.check-rust]
workspace = false
command = "cargo"
args = ["check", "--locked", "--all-features", "--all-targets", "--workspace"]

[tasks.check-typescript]
workspace = false
command = "npm"
args = ["run", "check"]

[tasks.storage-lifecycle]
workspace = false
command = "npm"
args = ["run", "storage:lifecycle"]

# Build
# | task                        | type      | cwd |
# | --------------------------- | --------- | --- |
# | build                       | composite |     |
# | build-candidate-linux-arm64 | command   |     |
# | build-rust                  | command   |     |
# | build-web                   | command   |     |

[tasks.build]
clear = true
workspace = false
dependencies = ["build-rust", "build-web"]

[tasks.build-candidate-linux-arm64]
workspace = false
command = "sh"
args = ["deploy/candidate-runtime/build-binaries.sh"]

[tasks.build-rust]
workspace = false
command = "cargo"
args = ["build", "--locked", "--all-features", "--all-targets", "--workspace"]

[tasks.build-web]
workspace = false
command = "npm"
args = ["run", "build"]

# Format
# | task                 | type      | cwd |
# | -------------------- | --------- | --- |
# | fmt                  | composite |     |
# | fmt-check            | composite |     |
# | fmt-rust             | command   |     |
# | fmt-rust-check       | command   |     |
# | fmt-toml             | command   |     |
# | fmt-toml-check       | command   |     |
# | fmt-typescript       | command   |     |
# | fmt-typescript-check | command   |     |

[tasks.fmt]
workspace = false
dependencies = ["fmt-rust", "fmt-toml", "fmt-typescript"]

[tasks.fmt-check]
workspace = false
dependencies = ["fmt-rust-check", "fmt-toml-check", "fmt-typescript-check"]

[tasks.fmt-rust]
workspace = false
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-rust-check]
workspace = false
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt-toml]
workspace = false
command = "taplo"
args = ["fmt"]

[tasks.fmt-toml-check]
workspace = false
command = "taplo"
args = ["fmt", "--check"]

[tasks.fmt-typescript]
workspace = false
command = "npm"
args = ["run", "format:fix"]

[tasks.fmt-typescript-check]
workspace = false
command = "npm"
args = ["run", "format"]

# Lint
# | task                  | type      | cwd |
# | --------------------- | --------- | --- |
# | lint                  | composite |     |
# | lint-fix              | composite |     |
# | lint-fix-rust         | command   |     |
# | lint-fix-typescript   | command   |     |
# | lint-fix-vstyle       | command   |     |
# | lint-rust             | command   |     |
# | lint-typescript       | command   |     |
# | lint-vstyle           | command   |     |

[tasks.lint]
workspace = false
dependencies = ["lint-rust", "lint-typescript", "lint-vstyle"]

[tasks.lint-fix]
workspace = false
dependencies = ["lint-fix-rust", "lint-fix-typescript", "lint-fix-vstyle"]

[tasks.lint-fix-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-fix-typescript]
workspace = false
command = "npm"
args = ["run", "lint", "--", "--fix"]

[tasks.lint-fix-vstyle]
workspace = false
command = "cargo"
args = ["vstyle", "tune", "--language", "rust", "--workspace", "--all-features", "--strict"]

[tasks.lint-rust]
workspace = false
command = "cargo"
args = [
	"clippy",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-typescript]
workspace = false
command = "npm"
args = ["run", "lint"]

[tasks.lint-vstyle]
workspace = false
command = "cargo"
args = ["vstyle", "curate", "--language", "rust", "--workspace", "--all-features", "--strict"]

# List
# | task                  | type    | cwd |
# | --------------------- | ------- | --- |
# | list-template-markers | command |     |

[tasks.list-template-markers]
workspace = false
command = "node"
args = ["scripts/list-template-markers.ts"]

# Initialize
# | task                  | type    | cwd |
# | --------------------- | ------- | --- |
# | init-database | command |     |

[tasks.init-database]
workspace = false
command = "node"
args = ["databases/init.ts"]

# Smoke
# | task                      | type    | cwd |
# | ------------------------- | ------- | --- |
# | smoke-database            | command |     |
# | smoke-calibration-database | command |     |
# | smoke-live-web            | command |     |
# | smoke-subscription        | command |     |
# | smoke-controlled-subscription | command |     |

[tasks.smoke-database]
workspace = false
script = '''
if [ -z "${AIQ_DATABASE_URL:-}" ]; then
	echo "AIQ_DATABASE_URL is required for smoke-database." >&2
	exit 2
fi
exec psql "$AIQ_DATABASE_URL" -X --set ON_ERROR_STOP=1 --file databases/smoke.sql
'''

[tasks.smoke-calibration-database]
workspace = false
script = '''
if [ -z "${AIQ_DATABASE_URL:-}" ]; then
	echo "AIQ_DATABASE_URL is required for smoke-calibration-database." >&2
	exit 2
fi
exec psql "$AIQ_DATABASE_URL" -X --set ON_ERROR_STOP=1 --file databases/calibration-integration.sql
'''

[tasks.smoke-live-web]
workspace = false
command = "npm"
args = ["run", "test:browser:live-stack", "--workspace", "@aiq/web"]

[tasks.require-subscription-smoke-platform]
private = true
workspace = false
script = '''
case "$(uname -s)" in
  Darwin|Linux) ;;
  *)
    echo "subscription smoke tasks are supported only on macOS and Linux." >&2
    exit 2
    ;;
esac
'''

[tasks.require-subscription-smoke-platform.windows]
script_runner = "@powershell"
script = '''
Write-Error "subscription smoke tasks are supported only on macOS and Linux."
exit 2
'''

[tasks.smoke-subscription]
workspace = false
dependencies = ["require-subscription-smoke-platform"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"--lib",
	"runner::subscription_smoke_tests::real_codex_subscription_smoke_executes_fixed_public_example_once",
	"--",
	"--ignored",
	"--exact",
	"--test-threads=1",
]

[tasks.smoke-controlled-subscription]
workspace = false
dependencies = ["require-subscription-smoke-platform"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"--lib",
	"runner::subscription_smoke_tests::real_codex_controlled_subscription_smoke_executes_fixed_hidden_task_once",
	"--",
	"--ignored",
	"--exact",
	"--test-threads=1",
]

# Test
# | task                       | type      | cwd |
# | -------------------------- | --------- | --- |
# | test                 | composite |     |
# | test-real-codex-host | command   |     |
# | test-rust            | command   |     |
# | test-typescript      | command   |     |

[tasks.test]
clear = true
workspace = false
dependencies = ["test-rust", "test-typescript"]

[tasks.test-rust]
workspace = false
command = "cargo"
args = ["nextest", "run", "--locked", "--workspace", "--all-targets", "--all-features"]

[tasks.test-typescript]
workspace = false
command = "npm"
args = ["run", "test"]

[tasks.build-real-codex-host-probe]
private = true
workspace = false
command = "cargo"
args = ["build", "--locked", "-p", "aiq-runner"]

[tasks.test-real-codex-host]
workspace = false
dependencies = ["build-real-codex-host-probe"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"adapter::tests::real_codex_",
	"--",
	"--ignored",
	"--test-threads=1",
]

[tasks.require-node-24-15]
workspace = false
command = "node"
args = [
	"-e",
	"const [major, minor] = process.versions.node.split('.').map(Number); if (major < 24 || (major === 24 && minor < 15)) { console.error('Node.js 24.15.0 or newer is required'); process.exit(1); }",
]
