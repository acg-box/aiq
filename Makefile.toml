# Monorepo workspace tasks.

[config]
default_to_workspace = false
skip_core_tasks = true

# Check
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | check          | composite |     |
# | check-database | command   |     |
# | typecheck      | command   |     |

[tasks.check]
clear = true
dependencies = [
	"check-database",
	"typecheck",
	"lint",
	"test",
]

[tasks.check-database]
command = "node"
args = ["scripts/check-database-schema.ts"]

[tasks.typecheck]
command = "npm"
args = ["run", "check"]

# Build
# | task                        | type      | cwd |
# | --------------------------- | --------- | --- |
# | build                       | composite |     |
# | build-rust                  | command   |     |
# | build-web                   | command   |     |

[tasks.build]
clear = true
dependencies = ["build-rust", "build-web"]

[tasks.build-rust]
command = "cargo"
args = ["build", "--locked", "--all-features", "--all-targets", "--workspace"]

[tasks.build-web]
command = "npm"
args = ["run", "build"]

# Format
# | task           | type      | cwd |
# | -------------- | --------- | --- |
# | fmt            | composite |     |
# | fmt-rust       | command   |     |
# | fmt-toml       | command   |     |
# | fmt-typescript | command   |     |

[tasks.fmt]
dependencies = ["fmt-rust", "fmt-toml", "fmt-typescript"]

[tasks.fmt-rust]
command = "rustup"
args = ["run", "nightly", "cargo", "fmt", "--all"]

[tasks.fmt-toml]
command = "sh"
args = [
	"-c",
	"git ls-files -z -- '*.toml' | xargs -0 taplo fmt",
]

[tasks.fmt-typescript]
command = "npm"
args = ["run", "format:fix"]

# Lint
# | task                  | type      | cwd |
# | --------------------- | --------- | --- |
# | lint                  | composite |     |
# | lint-fix              | composite |     |
# | lint-fix-rust         | command   |     |
# | lint-fix-typescript   | command   |     |
# | lint-fix-vstyle       | command   |     |
# | lint-rust             | command   |     |
# | lint-typescript       | command   |     |
# | lint-vstyle           | command   |     |

[tasks.lint]
dependencies = ["lint-rust", "lint-typescript", "lint-vstyle"]

[tasks.lint-fix]
dependencies = ["lint-fix-rust", "lint-fix-typescript", "lint-fix-vstyle"]

[tasks.lint-fix-rust]
command = "cargo"
args = [
	"clippy",
	"--fix",
	"--allow-dirty",
	"--locked",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-fix-typescript]
command = "npm"
args = ["run", "lint", "--", "--fix"]

[tasks.lint-fix-vstyle]
command = "cargo"
args = ["--locked", "vstyle", "tune", "--language", "rust", "--workspace", "--all-features", "--strict"]

[tasks.lint-rust]
command = "cargo"
args = [
	"clippy",
	"--locked",
	"--all-features",
	"--all-targets",
	"--workspace",
	"--",
	"-D",
	"clippy::all",
	"-D",
	"clippy::too_many_lines",
	"-D",
	"clippy::unwrap_used",
	"-D",
	"clippy::use_self",
	"-D",
	"clippy::wildcard_imports",
	"-D",
	"missing-docs",
	"-D",
	"unused-crate-dependencies",
	"-D",
	"warnings",
]

[tasks.lint-typescript]
command = "npm"
args = ["run", "lint"]

[tasks.lint-vstyle]
command = "cargo"
args = ["--locked", "vstyle", "curate", "--language", "rust", "--workspace", "--all-features", "--strict"]

# List
# | task                  | type    | cwd |
# | --------------------- | ------- | --- |
# | list-template-markers | command |     |

[tasks.list-template-markers]
command = "node"
args = ["scripts/list-template-markers.ts"]

# Database and Storage
# | task                | type    | cwd |
# | ------------------- | ------- | --- |
# | init-database       | command |     |
# | reset-database      | command |     |
# | check-aiq-2-cutover | command |     |
# | storage-lifecycle   | command |     |

[tasks.init-database]
command = "node"
args = ["databases/init.ts"]

[tasks.reset-database]
command = "node"
args = ["databases/reset.ts", "${@}"]

[tasks.check-aiq-2-cutover]
command = "node"
args = ["scripts/check-aiq-2-cutover.ts"]

[tasks.storage-lifecycle]
command = "npm"
args = ["run", "storage:lifecycle"]

# Smoke
# | task                      | type    | cwd |
# | ------------------------- | ------- | --- |
# | smoke-database            | command |     |
# | smoke-calibration-database | command |     |
# | smoke-live-web            | command |     |
# | smoke-subscription        | command |     |
# | smoke-controlled-subscription | command |     |

[tasks.smoke-database]
script = '''
if [ -z "${AIQ_DATABASE_URL:-}" ]; then
	echo "AIQ_DATABASE_URL is required for smoke-database." >&2
	exit 2
fi
exec psql "$AIQ_DATABASE_URL" -X --set ON_ERROR_STOP=1 --file databases/smoke.sql
'''

[tasks.smoke-calibration-database]
script = '''
if [ -z "${AIQ_DATABASE_URL:-}" ]; then
	echo "AIQ_DATABASE_URL is required for smoke-calibration-database." >&2
	exit 2
fi
exec psql "$AIQ_DATABASE_URL" -X --set ON_ERROR_STOP=1 --file databases/calibration-integration.sql
'''

[tasks.smoke-live-web]
command = "npm"
args = ["run", "test:browser:live-stack", "--workspace", "@aiq/web"]

[tasks.require-subscription-smoke-platform]
private = true
script = '''
case "$(uname -s)" in
  Darwin) ;;
  *)
    echo "subscription smoke tasks are supported only on macOS." >&2
    exit 2
    ;;
esac
'''

[tasks.require-subscription-smoke-platform.windows]
script_runner = "@powershell"
script = '''
Write-Error "subscription smoke tasks are supported only on macOS."
exit 2
'''

[tasks.smoke-subscription]
dependencies = ["require-subscription-smoke-platform"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"--lib",
	"runner::subscription_smoke_tests::real_codex_subscription_smoke_executes_fixed_public_example_once",
	"--",
	"--ignored",
	"--exact",
	"--test-threads=1",
]

[tasks.smoke-controlled-subscription]
dependencies = ["require-subscription-smoke-platform"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"--lib",
	"runner::subscription_smoke_tests::real_codex_controlled_subscription_smoke_executes_fixed_hidden_task_once",
	"--",
	"--ignored",
	"--exact",
	"--test-threads=1",
]

# Test
# | task                       | type      | cwd |
# | -------------------------- | --------- | --- |
# | test                      | composite |     |
# | test-browser              | composite |     |
# | test-database-concurrency | command   |     |
# | test-real-codex-host      | command   |     |
# | test-rust                 | command   |     |
# | test-typescript           | command   |     |
# | test-typescript-coverage  | command   |     |

[tasks.test]
clear = true
dependencies = ["test-rust", "test-typescript"]

[tasks.test-database-concurrency]
command = "node"
args = ["--test", "databases/artifact-resolver-concurrency.test.ts"]

[tasks.test-rust]
command = "cargo"
args = ["nextest", "run", "--locked", "--workspace", "--all-targets", "--all-features"]

[tasks.test-typescript]
command = "npm"
args = ["run", "test"]

[tasks.test-typescript-coverage]
command = "npm"
args = ["run", "test:coverage", "--workspace", "@aiq/web"]

[tasks.test-browser]
dependencies = ["build-web"]
command = "npm"
args = ["run", "test:browser:prebuilt", "--workspace", "@aiq/web"]

[tasks.build-real-codex-host-probe]
private = true
command = "cargo"
args = ["build", "--locked", "-p", "aiq-runner"]

[tasks.test-real-codex-host]
dependencies = ["build-real-codex-host-probe"]
command = "cargo"
args = [
	"test",
	"--locked",
	"-p",
	"aiq-runner",
	"adapter::tests::real_codex_",
	"--",
	"--ignored",
	"--test-threads=1",
]

# Verify
# | task   | type      | cwd |
# | ------ | --------- | --- |
# | verify | composite |     |

[tasks.verify]
clear = true
# `check` owns the complete read-only source gate. `test-browser` owns the Web
# build and browser integration boundary. Native release builds and production
# checks remain separate operator-controlled contracts.
dependencies = ["check", "test-browser"]

[tasks.require-node-24-15]
command = "node"
args = [
	"-e",
	"const [major, minor] = process.versions.node.split('.').map(Number); if (major < 24 || (major === 24 && minor < 15)) { console.error('Node.js 24.15.0 or newer is required'); process.exit(1); }",
]
